<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Mercado Municipal 360°</title>
  </head>
  <body>
    <div id="app">
      <div class="stage"></div>
      <div class="overlay"></div>
      <header class="topbar">
        <span class="scene-title">Carregando…</span>
        <button class="about" title="Sobre o Mercado">Sobre</button>
        <button class="about open-directory" title="Lista de comerciantes">Comerciantes</button>
        <span class="help">Arraste para olhar · <b>▲</b>, <kbd>W</kbd>/<kbd>S</kbd> ou dois cliques no chão para andar · roda/pinça = zoom</span>
      </header>
      <div class="tip">Toque em <b>▲</b> ou dê <b>dois toques</b> no chão para andar</div>
      <button class="forward" hidden>▲ <span></span></button>
      <div class="fader on"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
